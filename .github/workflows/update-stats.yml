# ============================================================================
# Mise à jour automatique du README de profil
# ============================================================================
# - Le script lit les stats avec STATS_TOKEN (PAT fine-grained, LECTURE SEULE)
#   et écrit README.md localement.
# - Ce workflow commite README.md avec le GITHUB_TOKEN du dépôt.
# Le PAT n'a donc aucun droit d'écriture. Configuration : README_PROJECT.md.
# ============================================================================
name: 📊 Update GitHub Stats

on:
  schedule:
    - cron: '23 1 * * *'  # 01:23 UTC, hors de l'heure pile (moins de retard)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Aperçu seulement (pas de commit)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update-stats:
    name: 🔄 Mettre à jour le README
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: update-stats
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: main

      - name: 🐍 Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.13'
          cache: pip

      - name: 📦 Install dependencies
        run: pip install --no-deps -r requirements.txt

      - name: 🚀 Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          CACHE_ENABLED: 'false'
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::Secret STATS_TOKEN absent (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/update_stats.py --dry-run
          else
            python scripts/update_stats.py
          fi

      - name: 💾 Commit README
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "ℹ️ README inchangé"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🤖 Auto-update GitHub stats - $(date -u +'%Y-%m-%d')" -m "Run ID: ${{ github.run_id }}"
          # Pas de push forcé : en cas de conflit, le job échoue et le run suivant réessaie
          git push origin HEAD:main
